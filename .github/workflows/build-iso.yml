name: Build ISO
on:
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Which image do you want to build an ISO for?'
        required: true
        default: 'fyros'
        type: choice
        options:
          - fyros
          - fyros-nvidia

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Build ISO
        uses: jasonn3/build-container-installer@main
        with:
          arch: x86_64
          image_name: ${{ inputs.image_name }}
          image_repo: ghcr.io/${{ github.repository_owner }}
          image_tag: latest
          version: 44
          iso_name: ${{ inputs.image_name }}-install.iso

      - name: Upload ISO as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.image_name }}-iso
          path: ./${{ inputs.image_name }}-install.iso
          retention-days: 3
